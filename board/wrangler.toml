name = "typing-board"
main = "worker.js"
compatibility_date = "2026-01-01"

# D1 바인딩. database_id 는 `wrangler d1 create` 가 찍어주는 값을 넣는다.
[[d1_databases]]
binding = "DB"
database_name = "typing-board"
database_id = "be06f642-f61a-4302-bbb0-eeca476c78c2"

# IP 해시용 소금은 시크릿으로 둔다. 리포에 남기지 않는다.
#   npx wrangler secret put IP_SALT
# 설정하지 않아도 worker.js 에 기본값이 있어 동작은 한다.
